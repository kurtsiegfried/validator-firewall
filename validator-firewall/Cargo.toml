[package]
name = "validator-firewall"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
tower-http = { version = "0.6", features = ["validate-request", "auth"] }
aya = "0.13"
aya-log = "0.2"
cidr = { version = "0.3", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
log = "0.4"
rangemap = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { version = "0.9" }
serde_json = "1.0"
solana-rpc-client = "2"
solana-sdk = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "ansi"] }
validator-firewall-common = { path = "../validator-firewall-common", features = ["user"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
duckdb = { version = "1", features = ["bundled"] }

[[bin]]
name = "validator-firewall"
path = "src/main.rs"

[[bin]]
name = "standalone-ip-service"
path = "src/ip_service_main.rs"
